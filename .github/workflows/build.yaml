on:
  push:
    branches: [main, beta, alpha]

  pull_request:
    branches: [main, beta, alpha]

jobs:
  build:
    # Fork PRs stay on GitHub-hosted runners: this repo is public and the
    # self-hosted runner is a privileged dind pod on the cluster's only node.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'gpu-agent-runners' }}
    env:
      POSTGRES_PRISMA_URL: postgresql://dummy:dummy@localhost:5432/dummy
      POSTGRES_URL_NON_POOLING: postgresql://dummy:dummy@localhost:5432/dummy
      EBAY_ENVIRONMENT: ${{ secrets.EBAY_ENVIRONMENT }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_AFFILIATE_CAMPAIGN_ID: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN_ID }}
      NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_DOMAIN }}

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v4
        with:
          # Fetch full git history so sitemap generation can use accurate
          # git timestamps for lastModified dates in sitemap.xml
          fetch-depth: 0

      # https://turbo.build/repo/docs/guides/ci-vendors/github-actions#caching-with-github-actionscache
      - name: cache turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # https://github.com/actions/setup-node#usage
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Generate sitemap with git timestamps before lint/build/docker steps.
      # The generated sitemap.static-pages.json will be:
      # 1. Used by lint (it's imported by the codebase)
      # 2. Copied into the Docker image (see Dockerfile COPY command for sitemap.static-pages.json)
      # This ensures deployed containers always have an up-to-date sitemap with
      # accurate lastModified dates from git history (requires fetch-depth: 0 above)
      - run: cd packages/web-app ; npm run gen-sitemap
      - run: npm run lint
      - run: npm run test

  docker:
    needs: build
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'gpu-agent-runners' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The self-hosted runner's dind bridge is MTU 1500 inside a 1450 pod
          # network, so large packets from github.com are dropped and downloads
          # in RUN steps hang forever. The host network uses the pod's 1450
          # MTU. See #74.
          driver-opts: network=host

      - name: Generate timestamp tag
        id: timestamp
        run: echo "tag=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image 🐳
        # Normally 6-12 minutes. `npm ci` inside the build has stalled with no
        # network traffic until cancelled (up to the 6h job limit); fail fast
        # instead. See #74.
        timeout-minutes: 20
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/app:v${{ steps.timestamp.outputs.tag }}
          # OCI labels link this container to the repo, enabling GitHub to send
          # package webhook events to the repo when images are published to GHCR.
          # Without these labels, webhooks (e.g., for Flux image automation) won't fire.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
