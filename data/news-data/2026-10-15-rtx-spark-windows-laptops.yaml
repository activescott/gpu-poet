title: "NVIDIA RTX Spark (N1X) Launches in Windows-on-Arm Laptops"
content: |
  Nvidia's RTX Spark (N1X) superchip is now shipping in Windows-on-Arm laptops, led by Microsoft's [Surface Laptop Ultra](https://www.notebookcheck.net/Microsoft-Surface-Laptop-Ultra-debuts-with-RTX-Spark-128-GB-unified-memory-and-2-599-starting-price.1418420.0.html), a 15-inch model starting at $2,599.

  N1X pairs an Arm CPU with a Blackwell GPU over a shared pool of memory, the same lineage as the desktop DGX Spark. The flagship configuration, per [PCMag's spec breakdown](https://www.pcmag.com/news/nvidia-rtx-spark-everything-you-need-to-know-before-our-first-tests), has 6,144 CUDA cores and 192 fifth-gen Tensor cores, up to 128GB of unified memory, and a rated peak of 1 petaflop of FP4 compute. A step-down chip drops to 5,120 CUDA cores and 16GB to 64GB of memory. Both share memory over a 256-bit LPDDR5X bus at up to 300 GB/s, linked to the CPU over NVLink-C2C at 600 GB/s.

  [Tom's Hardware's review](https://www.tomshardware.com/laptops/we-test-the-rtx-spark-superchip-in-microsofts-surface-laptop-ultra-nvidias-windows-on-arm-platform-impresses-in-local-ai-but-gaming-isnt-its-strong-suit) and [HotHardware's review](https://hothardware.com/reviews/nvidia-rtx-spark-platform-review), both published ahead of the October 16 on-sale date, land on the same tradeoff: strong local AI performance, gaming isn't the strength.

  ## Why it's not in the GPU rankings

  I'm not giving RTX Spark laptops a row in GPU Poet's tables. The chip only ships as part of a laptop configuration, not as a card with its own price, so there's no way to compute cost-per-performance the way the rankings do for a graphics card, and memory capacity swings from 16GB to 128GB depending on configuration rather than being fixed to one SKU. It's the same reasoning that keeps unified-memory systems like the DGX Spark out of the rankings and in the [AI Workstations guide](/gpu/learn/ai/use-case/gpu-cpu-combos) instead.

