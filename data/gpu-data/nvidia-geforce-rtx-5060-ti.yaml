notes:
  - 'fp16TFLOPS of 189.75 is FP16 Tensor Core throughput (FP16 accumulate) with 2:4 structured sparsity, derived as AI TOPS ÷ 4 (759 ÷ 4), the rule used for every GeForce Blackwell file. Dense FP16 Tensor is 94.88 TFLOPS.'
  - 'int8TOPS of 189.63 represents non-sparse (dense) INT8 performance, derived from sparse INT8 of 379.26 TOPS ÷ 2 per NVIDIA Blackwell architecture whitepaper. With 2:4 structured sparsity, INT8 performance is 379.26 TOPS. Dense value used for consistent cross-vendor comparison.'
  - 'fp32TFLOPS of 23.70 is FP32 vector (CUDA core) throughput, which on GeForce Blackwell equals TF32 Tensor Core throughput without sparsity. On GeForce Ampere, Ada and Blackwell, dense TF32 runs at the FP32 vector rate. NVIDIA''s RTX Blackwell whitepaper lists dense/sparse TF32 of 35.6/71.2 for the RTX 3090, 82.6/165.2 for the RTX 4090 and 104.8/209.5 for the RTX 5090, read from a search-result excerpt of the whitepaper rather than the PDF itself (https://images.nvidia.com/aem-dam/Solutions/geforce/blackwell/nvidia-rtx-blackwell-gpu-architecture.pdf).'
  - Power based on what NVIDIA refers to as "TGP (Total Graphics Power)".
  - The RTX 5060 Ti uses the GB206 chip with 4,608 CUDA cores across 36 streaming multiprocessors.
  - Memory bandwidth calculated as 128-bit interface × 28 Gbps = 448 GB/s.
  - Process node is 4nm with 21.9 billion transistors.
  - MSRP of $429 USD for the 16GB model sourced from nvidia.com official product page (https://www.nvidia.com/en-us/geforce/news/ultimate-guide-to-5060/). An 8GB variant is also available at $379 USD. No Founders Edition available; pricing is for partner cards.
  - No NVIDIA Founders Edition was released for the RTX 5060 Ti. All cards are from AIB partners including ASUS, MSI, Gigabyte, Zotac, PNY, Palit, Gainward, Colorful, INNO3D, GALAX/KFA2.
  - Third-party product identifiers sourced from official manufacturer websites (ASUS, Gigabyte), Tom's Hardware RTX 5060 Ti roundup, Newegg, and Best Buy product listings.
  - 'fp4TFLOPS of 379.5 represents non-sparse (dense) FP4 performance, derived from the official NVIDIA AI TOPS figure of 759 (FP4 sparse, per nvidia.com/en-us/geforce/graphics-cards/compare/) ÷ 2. Dense value used for consistent cross-vendor comparison.'
  - 'NOT FOUND: fp8TFLOPS — NVIDIA does not publish a standalone dense or sparse FP8 TFLOPS figure for consumer GeForce Blackwell cards; searched the NVIDIA RTX Blackwell architecture whitepaper and the official RTX 5060 Ti/compare pages (URLs in references), which list only AI TOPS (FP4 sparse), Peak TF32 Tensor TFLOPS, Peak FP16 Tensor TFLOPS, and INT8 TOPS. Left null rather than guessed from the INT8 dense value.'
  - 'supportedHardwareOperations: INT4 removed per the locked GEMM-only definition (2026-09) — neither the consumer nor datacenter Blackwell documentation lists INT4 Tensor Core support (dropped starting with Blackwell per gpu-researcher.md''s canonical Blackwell table); the array now matches the canonical consumer Blackwell baseline of FP4, FP8, FP16, BF16, TF32, INT8.'
