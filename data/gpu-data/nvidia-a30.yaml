  - 'Phase 5 audit (2026-09-02): gpuArchitecture normalized from lowercase ''ampere'' to canonical ''Ampere'' capitalization per the canonical table in .claude/agents/gpu-researcher.md.'
  - 'Phase 5 audit (2026-09-02): supportedHardwareOperations reviewed against the canonical Ampere baseline in .claude/agents/gpu-researcher.md (TF32, BF16, FP16, INT8, INT4) — file already matched. FP64 is retained because the A30 is GA100-based (explicitly stated in the summary above: "Built on the GA100 graphics processor"), and per NVIDIA''s Ampere architecture whitepaper the GA100 die''s 3rd-gen Tensor Cores add a dedicated FP64 Tensor Core path not present on GA10x consumer/professional dies. No change made to the array.'
  - 'fp8TFLOPS and fp4TFLOPS are left null (field omitted) and not added to unverifiedSpecs — this is a confirmed hardware negative, not a research gap. The A30''s Ampere 3rd-generation Tensor Cores predate both FP8 (introduced in Ada Lovelace/Hopper) and FP4 (introduced in Blackwell) tensor formats, per the canonical architecture table in .claude/agents/gpu-researcher.md.'
