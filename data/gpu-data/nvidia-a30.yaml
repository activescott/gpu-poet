notes:
  - 'fp32TFLOPS of 82 is TF32 Tensor Core throughput without sparsity, per NVIDIA''s A30 page (nvidia.com/en-us/data-center/products/a30-gpu/). The datasheet''s headline "165 teraFLOPS (TFLOPS) of TF32 deep learning performance" is the figure with sparsity. FP32 vector (CUDA core) throughput is 10.3 TFLOPS.'
  - 'fp16TFLOPS of 330 is FP16 Tensor Core throughput with 2:4 structured sparsity, as NVIDIA''s A30 page (nvidia.com/en-us/data-center/products/a30-gpu/) publishes it: 165 dense and 330 with sparsity.'
  - MSRP of $4,599 USD verified from 3 sources - Cyfuture Cloud cites Thinkmate offering the NVIDIA A30 GPU at $4,599.00, Amazon lists the PNY NVIDIA A30 Module 24GB at $5,199.00, and router-switch.com notes the retail price hovers between $3,500-$5,000 depending on supplier and availability.
