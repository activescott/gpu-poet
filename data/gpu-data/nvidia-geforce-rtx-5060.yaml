notes:
  - 'fp16TFLOPS of 153.5 is FP16 Tensor Core throughput (FP16 accumulate) with 2:4 structured sparsity, derived as AI TOPS ÷ 4 (614 ÷ 4), the rule used for every GeForce Blackwell file. Dense FP16 Tensor is 76.75 TFLOPS.'
  - 'int8TOPS of 153.42 represents non-sparse (dense) INT8 performance, derived from sparse INT8 of 306.83 TOPS ÷ 2 per NVIDIA Blackwell architecture whitepaper. With 2:4 structured sparsity, INT8 performance is 306.83 TOPS. Dense value used for consistent cross-vendor comparison.'
  - 'fp32TFLOPS of 19.18 is FP32 vector (CUDA core) throughput, which on GeForce Blackwell equals TF32 Tensor Core throughput without sparsity. On GeForce Ampere, Ada and Blackwell, dense TF32 runs at the FP32 vector rate. NVIDIA''s RTX Blackwell whitepaper lists dense/sparse TF32 of 35.6/71.2 for the RTX 3090, 82.6/165.2 for the RTX 4090 and 104.8/209.5 for the RTX 5090, read from a search-result excerpt of the whitepaper rather than the PDF itself (https://images.nvidia.com/aem-dam/Solutions/geforce/blackwell/nvidia-rtx-blackwell-gpu-architecture.pdf).'
  - Power based on what NVIDIA refers to as "TGP (Total Graphics Power)".
  - The RTX 5060 uses the GB206 chip with 3,840 CUDA cores across 30 streaming multiprocessors.
  - Memory bandwidth calculated as 128-bit interface × 28 Gbps = 448 GB/s.
  - Process node is 4nm with 21.9 billion transistors.
  - The RTX 5060 and RTX 5060 Ti share the same memory bandwidth (448 GB/s) but differ in VRAM capacity (8GB vs 16GB).
  - MSRP of $299 USD sourced from nvidia.com official product page (https://www.nvidia.com/en-us/geforce/news/rtx-5060-out-now/). No Founders Edition available; pricing is for partner cards.
  - No NVIDIA Founders Edition was released for the RTX 5060. All cards are from AIB partners including ASUS, MSI, Gigabyte, Zotac, PNY, Palit, Gainward, Colorful, INNO3D, GALAX/KFA2.
  - Gigabyte offers a unique low-profile RTX 5060 OC Low Profile 8G (GV-N5060OC-LP-8GD) for small form factor and server builds. It is 182mm long with three small fans.
  - Third-party product identifiers sourced from official manufacturer websites (ASUS, Gigabyte), Tom's Hardware RTX 5060 roundup, Newegg, and Best Buy product listings.
  - 'fp4TFLOPS of 307 represents non-sparse (dense) FP4 performance, derived from the official NVIDIA AI TOPS figure of 614 (FP4 sparse, per nvidia.com/en-us/geforce/graphics-cards/compare/) ÷ 2. Dense value used for consistent cross-vendor comparison.'
  - 'NOT FOUND: fp8TFLOPS — NVIDIA does not publish a standalone dense or sparse FP8 TFLOPS figure for consumer GeForce Blackwell cards; searched the NVIDIA RTX Blackwell architecture whitepaper and the official RTX 5060/compare pages (URLs in references), which list only AI TOPS (FP4 sparse), Peak TF32 Tensor TFLOPS, Peak FP16 Tensor TFLOPS, and INT8 TOPS. Left null rather than guessed from the INT8 dense value.'
  - 'supportedHardwareOperations: INT4 removed per the locked GEMM-only definition (2026-09) — neither the consumer nor datacenter Blackwell documentation lists INT4 Tensor Core support (dropped starting with Blackwell per gpu-researcher.md''s canonical Blackwell table); the array now matches the canonical consumer Blackwell baseline of FP4, FP8, FP16, BF16, TF32, INT8.'
