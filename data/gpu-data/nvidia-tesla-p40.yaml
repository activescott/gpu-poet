summary: The NVIDIA Tesla P40 is a passively cooled, dual-slot PCIe inference
  accelerator announced in September 2016. It is built on the Pascal GP102 GPU
  with 3,840 CUDA cores and 24 GB of GDDR5 on a 384-bit bus. It has no Tensor
  Cores, and its FP16 runs at 1/64 the FP32 rate, so it suits FP32 and INT8
  (DP4A) work. Used cards are a common low-cost way to get 24 GB of VRAM for
  running LLMs at home.

