notes:
  - 'FP32 vector (CUDA core) throughput of 12.0 TFLOPS sourced from NVIDIA official product page and confirmed by PNY product page.'
  - Tensor performance of 191.9 TFLOPS represents peak FP8 tensor performance with sparsity.
  - FP16 TFLOPS of 95.9 represents Peak Sparse Tensor Core performance (calculated as half of FP8 Sparse performance). This metric is selected to align with the card's workstation AI capabilities.
  - 'int8TOPS of 95.95 represents non-sparse (dense) INT8 performance, derived from sparse INT8 of 191.9 TOPS ÷ 2 per NVIDIA Ada Lovelace architecture. With 2:4 structured sparsity, INT8 performance is 191.9 TOPS. Dense value used for consistent cross-vendor comparison.'
  - 'fp8TFLOPS of 95.95 represents non-sparse (dense) FP8 performance, derived from the peak FP8 tensor performance of 191.9 TFLOPS with sparsity (per NVIDIA Ada Lovelace architecture, this file''s pre-existing note) ÷ 2. NVIDIA''s Ada Lovelace 4th-generation Tensor Cores process FP8 and INT8 at identical per-clock throughput (both are 8-bit formats), so dense FP8 (95.95) numerically equals dense INT8 (95.95). Dense value used for consistent cross-vendor comparison.'
  - Ada Lovelace has no FP4 hardware path (FP4 tensor core support was introduced in Blackwell) — fp4TFLOPS is left null and is a confirmed hardware negative, not a research gap, so it is not added to unverifiedSpecs.
  - Memory bandwidth calculated as 128-bit interface × 14 Gbps ÷ 8 bits/byte = 224 GB/s.
  - CUDA Compute Capability 8.9 is standard for Ada Lovelace architecture workstation GPUs.
  - The GPU uses the AD107 chip with 22 of 24 SMs enabled, fabricated on TSMC 4N custom process.
  - TDP is 70W, no external power connector required.
  - MSRP of $625 USD positions it as the entry-level model in the Ada workstation lineup.
  - 'supportedHardwareOperations corrected during the 2026-09-02 Phase 5 audit to remove FP32: per the canonical Ada Lovelace supportedHardwareOperations table (locked precision-filters plan definition, "hardware-accelerated matrix/tensor-core path support only"), FP32 is not a standalone Ada Tensor Core format — it only appears as plain shader/CUDA-core ALU throughput or as the TF32 reduced-precision tensor proxy. Canonical set is FP8, FP16, BF16, TF32, INT8, INT4, uniform across all Ada SKUs (GeForce, professional, and datacenter) per the NVIDIA Ada GPU Architecture whitepaper.'
  - 'fp32TFLOPS of 24 is TF32 Tensor Core throughput without sparsity. NVIDIA does not publish a dense TF32 figure for this card. Derived as the 191.9 TFLOPS Tensor figure (FP8 with sparsity) on NVIDIA''s RTX 2000 Ada page / 8 = 23.99, since professional Ada Tensor Cores run FP8 with sparsity at 8 × dense TF32. FP32 vector (CUDA core) throughput is 12.0 TFLOPS; professional parts other than the L40 run dense TF32 at 2 × FP32 vector, as Table 4 of NVIDIA''s RTX PRO Blackwell architecture whitepaper shows for the RTX A6000 (77.4 vs 38.7), RTX 6000 Ada (182.1 vs 91.1) and RTX PRO 6000 Workstation (251.9 vs 126.0) (https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf).'
