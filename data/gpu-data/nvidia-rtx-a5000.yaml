notes:
  - 'int8TOPS of 222.2 represents non-sparse (dense) INT8 performance, derived from sparse INT8 of 444.4 TOPS ÷ 2. For Ampere architecture, INT8 sparse = 2× FP16 sparse tensor performance (222.2 TFLOPS). Dense value used for consistent cross-vendor comparison. Source: NVIDIA Ampere professional graphics line card and forums.developer.nvidia.com.'
  - "FP16 TFLOPS of 222.2 represents Peak Sparse Tensor Core performance (sourced from NVIDIA datasheet Tensor Performance)."
  - "Note: Previous versions incorrectly listed dense performance (111.1 TFLOPS) as sparse. Updated to match Workstation and Ada generation metrics (222.2 TFLOPS)."
  - MSRP of $2,250 USD verified from 3 sources - DEVELOP3D notes expected street price of $2,250, CG Channel confirms pricing of $1,000 for RTX A4000 and $2,250 for RTX A5000, and TechPowerUp GPU Database lists launch price.
  - "Manufacturer identifiers: Board ID PG132 with SKU 500 confirmed from TechPowerUp and multiple reseller listings. Multiple NVPN (NVIDIA Part Numbers) exist for different variants: 900-5G132-2200-000 (standard), 900-5G132-2500-000 (retail), 900-5G132-1700-000 (PNY), and 900-5G132-0100-001 (Dell OEM)."
  - "Third-party products: Part numbers sourced from official vendor websites and authorized resellers. PNY uses VCNRTXA5000-PB as their primary SKU. Dell offers two part numbers (490-BHTI and J4KCH/0J4KCH) for different configurations. HP uses 20X23AA. Lenovo uses 4X61D97085. Supermicro uses GPU-NVQRTX-A5000. ASUS uses 90SKC000-M5LAN0."
  - 'Phase 5 audit (2026-09-02): gpuArchitecture normalized from lowercase ''ampere'' to canonical ''Ampere'' capitalization per the canonical table in .claude/agents/gpu-researcher.md.'
  - 'Phase 5 audit (2026-09-02): FP64 removed from supportedHardwareOperations. The RTX A5000 uses the GA102 die (confirmed in the summary above: "NVIDIA''s GA102 GPU architecture"), not GA100. Per an NVIDIA staff reply on this exact GPU''s NVIDIA Developer Forums thread, ''The Tensor core units in the GA102 chip architecture do not contain the FP64 path that is present in e.g. the Tensor core units in the A100 GPU'' (https://forums.developer.nvidia.com/t/what-is-the-fp64-rpeak-value-for-a5000/196056). Canonical Ampere baseline (TF32, BF16, FP16, INT8, INT4) applied per .claude/agents/gpu-researcher.md; FP64 Tensor Core support is reserved for GA100-based SKUs (A100, A30) only.'
  - 'fp8TFLOPS and fp4TFLOPS are left null (field omitted) and not added to unverifiedSpecs — this is a confirmed hardware negative, not a research gap. The RTX A5000''s Ampere 3rd-generation Tensor Cores predate both FP8 (introduced in Ada Lovelace/Hopper) and FP4 (introduced in Blackwell) tensor formats, per the canonical architecture table in .claude/agents/gpu-researcher.md.'
  - 'fp32TFLOPS of 55.6 is TF32 Tensor Core throughput without sparsity. NVIDIA does not publish a dense TF32 figure for this card. Derived as the 222.2 TFLOPS Tensor figure (FP16 with sparsity) in NVIDIA''s RTX A5000 datasheet / 4 = 55.55, since professional Ampere Tensor Cores run FP16 with sparsity at 4 × dense TF32. FP32 vector (CUDA core) throughput is 27.8 TFLOPS; professional parts other than the L40 run dense TF32 at 2 × FP32 vector, as Table 4 of NVIDIA''s RTX PRO Blackwell architecture whitepaper shows for the RTX A6000 (77.4 vs 38.7), RTX 6000 Ada (182.1 vs 91.1) and RTX PRO 6000 Workstation (251.9 vs 126.0) (https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/pdf/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1_1.pdf).'
